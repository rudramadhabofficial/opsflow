version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: opsflow-db
    environment:
      POSTGRES_USER: opsflow
      POSTGRES_PASSWORD: opsflow_password
      POSTGRES_DB: opsflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
